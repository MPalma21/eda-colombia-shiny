[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-colombia-shiny"
version = "1.0.0"
description = "Aplicación EDA para datos.gov.co construida con Shiny for Python siguiendo estándares de arquitectura limpia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "shiny>=1.0.0",
    "shinywidgets>=0.8.0",
    "plotly>=5.15.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
